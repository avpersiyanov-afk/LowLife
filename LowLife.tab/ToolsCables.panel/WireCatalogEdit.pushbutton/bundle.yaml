tooltip: |
  Окно-таблица справочника кабелей (ключевой спецификации для параметра цепи «Проводник»): правка значений, добавление новых кабелей (пустая строка внизу или «Копировать строку» — копия выбранной как основа). Изменения записываются одной транзакцией по «Сохранить». Удалять строки нельзя — на них могут ссылаться цепи.
title_en: "Edit\ncatalog"
tooltip_en: >-
  A table window for the cable catalog (the key schedule for the circuit «Wire» parameter): edit
  values, add new cables (the empty row at the bottom or «Copy row» — a copy of the selected one as a
  starting point). Changes are written in one transaction on «Save». Rows can't be deleted — circuits
  may refer to them.
