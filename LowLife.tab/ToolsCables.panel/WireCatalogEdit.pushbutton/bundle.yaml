tooltip: |
  Окно-таблица справочника кабелей (ключевой спецификации для параметра цепи «Проводник»): правка значений, добавление новых кабелей (пустая строка внизу или «Копировать строку» — копия выбранной как основа). Изменения записываются одной транзакцией по «Сохранить». Удалять строки нельзя — на них могут ссылаться цепи.
