tooltip: |
  Разбирает «Входящие» классического Outlook за последние N дней и составляет список задач в Excel. Письма анализирует Claude через Claude Code CLI (claude -p) под вашей подпиской. Почта только читается: ничего не отправляется, не помечается прочитанным и не перемещается.

  Shift+клик — настройки: период, только непрочитанные, подпапка, путь к claude.exe, модель, тестовый режим.
