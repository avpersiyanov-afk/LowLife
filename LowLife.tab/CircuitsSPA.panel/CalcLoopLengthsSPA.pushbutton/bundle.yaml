tooltip: |
  Считает длину каждого шлейфа СПА по координатам устройств (по катетам, не по кратчайшему расстоянию), записывает её в цепь, маркирует устройства и проставляет им предыдущий адрес — та же логика, что у «Длины шлейфов СПС».

  Переход между этажами: если у соседних по адресу устройств разный этаж и в настройках задано «Ключевое слово стояка», участок считается не напрямую, а через ближайший стояк на каждом из двух этажей (устройство -> стояк -> стояк -> устройство). Без стояка (или пока он не найден) — как раньше, напрямую.

  Кольцевой шлейф: если в настройках «Кольцевой шлейф» = «да», магистраль (без веток изоляторов — они не удваиваются) замыкается обратно на панель: добавляется участок от последнего устройства магистрали до ближайшего стояка на его этаже, а если стояк не найден — прямой участок до панели.
