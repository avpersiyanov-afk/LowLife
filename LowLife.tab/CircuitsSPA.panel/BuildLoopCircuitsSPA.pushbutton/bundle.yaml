tooltip: |
  Создаёт по одной электрической цепи на каждый шлейф СПА и подключает её к своей панели. Шлейф определяется по адресу устройства вида "панель.шлейф.номер" (например 3.1.2) — та же логика, что у кнопки «Цепи шлейфов СПС», но ищет панели и устройства в рабочем наборе с ключевым словом «СПА» (у СПС — «СПС»), настройки у систем раздельные. Каждой созданной цепи сразу проставляется режим траектории «Все устройства» и, по получившейся длине (Revit Length x коэффициент запаса, округление до целого), «Длина проводника» и «Способ прокладки».
