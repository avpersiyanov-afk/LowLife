tooltip: |
  Создаёт по одной электрической цепи на каждый шлейф СПС и подключает её к своей панели. Шлейф определяется по адресу устройства вида "панель.шлейф.номер" (например 3.1.2). Каждой созданной цепи сразу проставляется режим траектории «Все устройства» и, по получившейся длине (Revit Length x коэффициент запаса, округление до целого), «Длина проводника» и «Способ прокладки».
