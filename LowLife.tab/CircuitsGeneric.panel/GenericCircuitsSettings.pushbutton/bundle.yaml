tooltip: |
  Настройки кнопки «Цепь (общее)»: тип электрической цепи, кабель (строка справочника) и параметр цепи, куда он пишется, параметр цепи «Имя нагрузки» и список параметров подключаемого устройства, из которых оно собирается (через разделитель; один параметр = одиночный источник), а также режим — отдельная цепь на каждое устройство или все устройства в одну общую цепь.

  Значения хранятся в отдельном файле и подставляются при каждом запуске кнопки «Цепь (общее)».
