tooltip: |
  Строит произвольные электрические цепи «панель → устройства» по настройкам «Параметры цепей (общее)» — ничего не зашито в код. Выберите панель и все устройства вместе, одним выбором (рамкой и/или кликами, без порядка; панель определяется автоматически по категории «Электрооборудование», среди выбранного она должна быть ровно одна). Выбор отфильтрован — нельзя случайно захватить аннотации, связанные файлы, оси, уровни, текст, линии детализации и обобщённые модели.

  Тип цепи берётся из настроек (а если там пусто — по коннектору устройства, запасной вариант Data). Кабель (строка справочника) проставляется в параметр цепи из настроек, если он там выбран (необязательно). Параметру цепи «Имя нагрузки» присваивается значение, собранное из параметров подключаемого устройства по списку имён через разделитель (один параметр в списке = одиночный источник; для каждого имени сначала берётся параметр экземпляра, затем — типа).

  Режим — в настройках: либо отдельная цепь на каждое устройство (у каждой своё имя нагрузки), либо все устройства в одну общую цепь (имя нагрузки при этом не заполняется).
