tooltip: |
  Лоток СС (Лестничный) — делает активным рабочий набор лотков (по умолчанию «КНК») и запускает вставку лотка типа, в имени которого есть (по умолчанию) «СС_ЛЛ_1.5_СЦ». Shift+клик — общие настройки всех кнопок лотков (рабочий набор и имена типов).
title_en: "Tray\nSS"
tooltip_en: >-
  SS tray (ladder) — makes the tray workset active (by default «КНК») and starts placing a tray of the
  type whose name contains (by default) «СС_ЛЛ_1.5_СЦ». Shift+click — shared settings of all tray
  buttons (workset and type names).
