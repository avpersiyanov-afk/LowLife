tooltip: |
  Ограничивает, что попадает в выделение на активном виде, только нужными категориями — включатель/выключатель. Обычный клик включает фильтр по категориям, отмеченным в прошлый раз: дальше выбирайте элементы совершенно как обычно (клик, рамка, Ctrl/Shift) сколько угодно раз — элементы других категорий остаются видимыми, просто не попадают в выделение, а панель «Свойства» работает как всегда, потому что это штатное выделение Revit. Повторный клик по кнопке выключает фильтр. Shift+клик — настройка: список категорий активного вида, отметьте нужные галочками и нажмите «Сохранить».
