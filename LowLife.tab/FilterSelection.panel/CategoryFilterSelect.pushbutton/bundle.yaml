tooltip: |
  Выделение элементов на активном виде, ограниченное только нужными категориями. Обычный клик — сразу запускает выбор по категориям, отмеченным в прошлый раз, без вопросов: выделяйте элементы кликом и/или рамкой, подхватятся только они; Enter (или ПКМ → «Готово») завершает — выделение останется активным в Revit. Shift+клик — настройка: список категорий активного вида (с числом элементов в каждой), отметьте нужные галочками и нажмите «Сохранить».
