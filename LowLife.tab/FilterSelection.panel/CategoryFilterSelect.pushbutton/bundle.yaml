tooltip: |
  Выделение элементов на активном виде, ограниченное только нужными категориями. Обычный клик — сразу запускает выбор по категориям, отмеченным в прошлый раз, без вопросов: выделяйте элементы кликом и/или рамкой, подхватятся только они; Enter (или ПКМ → «Готово») завершает — выделение останется активным в Revit, а вкладка «Свойства» сама станет активной, чтобы сразу менять параметры. Shift+клик — настройка: список категорий активного вида, отметьте нужные галочками и нажмите «Сохранить».
