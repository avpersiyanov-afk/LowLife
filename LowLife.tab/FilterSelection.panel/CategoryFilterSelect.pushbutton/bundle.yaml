tooltip: |
  Выделение элементов на активном виде, ограниченное только нужными категориями. По кнопке показывается список категорий, которые есть на активном виде (с числом элементов в каждой) — отметьте галочками нужные и нажмите «Выбрать». После этого выделяйте элементы кликом и/или рамкой: в выделение попадут только элементы отмеченных категорий. Нажмите Enter (или ПКМ → «Готово»), чтобы завершить — выделение останется активным в Revit после закрытия инструмента.
