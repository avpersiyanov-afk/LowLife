tooltip: |
  Ограничивает, что можно выбрать на активном виде, только нужными категориями. Обычный клик — сразу временно изолирует на виде категории, отмеченные в прошлый раз (штатный Isolate Category Revit): всё остальное скрывается, а дальше выбирайте элементы как обычно — кликом, рамкой, Ctrl/Shift, сколько угодно раз — панель «Свойства» работает как всегда и сразу показывает параметры. Снять изоляцию — значок внизу окна вида → «Reset Temporary Hide/Isolate», либо снова нажать эту кнопку. Shift+клик — настройка: список категорий активного вида, отметьте нужные галочками и нажмите «Сохранить».
