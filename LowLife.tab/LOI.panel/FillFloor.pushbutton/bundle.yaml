tooltip: |
  Записывает в настроенный параметр (например «Этаж») значение по уровню элемента — уровень определяется через Element.LevelId (тот же способ, что у параметра «Уровень» в свойствах экземпляра), не по положению на плане. Проходит по всем элементам модели документа, без привязки к активному виду.

  Элемент без уровня и элемент, чей уровень не настроен (пустое значение в таблице настроек), пропускаются.

  Shift+клик — настройки: имя параметра «Этаж» и таблица «Уровень / Значение» со всеми уровнями документа.
