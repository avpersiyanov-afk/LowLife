tooltip: |
  Клонирует значения параметров из элементов категории «Форма» во все элементы активного вида, физически находящиеся внутри солида конкретной «Формы» — проверка точная, по солиду (для точечных элементов — попадание точки, для линейных, например лотков — пересечение линии с солидом). «Формы» ищутся и в текущем файле, и во всех загруженных связях (например в архитектурной модели) — их геометрия пересчитывается в координаты текущего файла.

  Элемент, попавший ровно в одну форму, заполняется сразу. Элемент, попавший сразу в несколько форм (типично — линейный элемент на границе двух форм), автоматически не трогается — по завершении открывается таблица таких элементов (ID, тип, значения-кандидаты по каждой форме), где для каждого выбирается форма-источник; клик по строке выделяет элемент в модели.

  Shift+клик — настройки (имя категории «Форма» и список клонируемых параметров).
