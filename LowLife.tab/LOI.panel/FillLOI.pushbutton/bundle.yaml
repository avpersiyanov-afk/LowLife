tooltip: |
  Клонирует значения параметров из элементов категории «Формы» во все проверяемые элементы, физически находящиеся внутри солида конкретной «Формы» — проверка точная, по солиду (для точечных элементов — попадание точки, для линейных, например лотков — пересечение линии с солидом). «Формы» ищутся в моделях, отмеченных в настройках (текущий файл и/или конкретные загруженные связи).

  Элемент, попавший ровно в одну форму, заполняется сразу. Элемент, попавший сразу в несколько форм (типично — линейный элемент на границе двух форм), по умолчанию разрезается по границе форм, каждый кусок получает значения своей формы; то, что разрезать не удалось, идёт в таблицу конфликтов, где для каждого выбирается форма-источник.

  Shift+клик — настройки: в каких моделях искать «Формы», список клонируемых параметров, какие элементы проверять и разрешение конфликтов на границе форм.
