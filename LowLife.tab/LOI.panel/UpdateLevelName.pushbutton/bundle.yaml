tooltip: |
  Назначает опорный уровень выбранным экземплярам семейств, у которых его нет вовсе и нет основы (например, вставленным без уровня). Уровень — выбранный из списка или по высоте: ближайший уровень не выше элемента.

  Сначала пробует просто прописать параметр «Уровень» (элемент остаётся на месте). Если Revit не даёт его менять, после подтверждения пересоздаёт экземпляр с уровнем на том же месте: тип, поворот/отражение, параметры экземпляра, рабочий набор и электрические цепи переносятся, но ID элемента меняется, а марки старого удаляются.

  Элементы с уровнем, на основе, вложенные и в группах пропускаются. После работы выделены получившиеся элементы.
