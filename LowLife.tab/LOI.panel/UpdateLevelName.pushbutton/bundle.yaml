tooltip: |
  Записывает имя уровня в настроенный текстовый параметр у выбранных элементов. Уровень берётся из свойств элемента (Element.LevelId); если его там нет (например, семейство размещено на грани связи или по рабочей плоскости без уровня) — ближайший уровень документа не выше элемента по высоте. Уже записанное значение перезаписывается.

  Сначала выберите элементы, потом нажмите кнопку.

  Shift+клик — настройки: имя параметра, в который пишется уровень.
