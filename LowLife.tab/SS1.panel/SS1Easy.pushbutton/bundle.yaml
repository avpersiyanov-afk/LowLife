tooltip: |
  Расстановка оборудования СС1: два кросса в каждой шахте СС на каждом отмеченном уровне, через который шахта проходит, и кабельный подвод у двери из прихожей со стороны коридора/вестибюля (по связи АР), плюс электрическая цепь от кросса №1 шахты своей секции к каждому подводу. Перед расстановкой старые экземпляры выбранных типоразмеров на отмеченных уровнях удаляются. Shift+клик — настройки (шахта СС, семейства и типы кросса и подвода, помещения, параметры, высоты).
