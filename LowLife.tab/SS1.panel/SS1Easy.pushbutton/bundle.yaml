tooltip: |
  Расстановка оборудования СС1: два кросса в каждой шахте СС на каждом отмеченном уровне, через который шахта проходит, и кабельный подвод у двери из прихожей в коридор/вестибюль (по связи АР). Перед расстановкой старые экземпляры выбранных типоразмеров на отмеченных уровнях удаляются. Shift+клик — настройки (семейства и типы, параметры, помещения, высоты).
