tooltip: |
  Строит на активном чертёжном виде сечение кабельного лотка с фактической раскладкой кабелей по данным из Excel (лист «Сводный»: марка, диаметр, участок, кол-во, система, % заполнения, высота и ширина лотка).

  Кабели укладываются от большего диаметра к меньшему — каждый в самую низкую точку касания пола, стенок или уже уложенных кабелей (не сетка/перебор, а точное геометрическое решение). Кабели, которым не хватило места по высоте лотка, показаны отдельным предупреждением, а не пропадают молча.

  Список участков — с галочками, отметьте нужные (построятся стопкой сверху вниз от одной точки, не внахлёст). Режим: «Сечение и таблица», «Только сечение» или «Только таблица» — чтобы положить сечение и таблицу на разные чертёжные виды, запустите кнопку дважды. Марки внутри каждого участка нумеруются с 1.

  Раскладка кабелей в сечении — два варианта. «Россыпью» — все кабели вперемешку, плотно, слева направо. «Группами (ромашкой)» — каждый тип своей центрированной пирамидкой на полу лотка, пирамидки идут слева направо (для 4 кабелей: 3 снизу + 1 сверху). Если кабелей в типе больше 8 — они стягиваются в пучки по ~8 «ромашкой» (2 рядом, 3 треугольник, 4 квадрат, 5–8 центр + кольцо) с кольцом-стяжкой, и пирамидка складывается из ромашек. Что не влезло в свою пирамидку (упёрлась в верх или бок лотка) — не обрезается и не висит в воздухе: докладывается в ближайшее свободное место лотка поверх уже уложенного (пустоты над короткими пирамидками и по бокам).

  Отдельная настройка: кабели системы «СОУЭ РО» уходят в свой отсек лотка за вертикальной перегородкой.

  Контур лотка и кружки рисуются в реальном размере (масштабируются видом), а таблица и подписи — «бумажного» размера с учётом масштаба вида, поэтому читаются одинаково при любом масштабе.

  Файл .xlsx или .xlsm (макросы не мешают — читается напрямую, без Excel). Данные берутся с листа «сводные данные для плагина» (ищется по имени среди всех листов книги; если не найден — скрипт спросит список). Столбцы жёстко по порядку: A марка, B диаметр, C участок, D кол-во, F система, G % заполнения, H высота лотка, I ширина лотка; участок протягивается вниз по объединённым ячейкам.

  Откройте чертёжный вид и нажмите кнопку — лист, участки, режим, марки и точку вставки скрипт спросит сам.
