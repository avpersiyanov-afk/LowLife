tooltip: |
  Строит на активном чертёжном виде сечение кабельного лотка с фактической раскладкой кабелей по данным из Excel (лист «Сводный»: марка, диаметр, участок, кол-во, система, % заполнения, высота и ширина лотка).

  Кабели укладываются от большего диаметра к меньшему — каждый в самую низкую точку касания пола, стенок или уже уложенных кабелей (не сетка/перебор, а точное геометрическое решение). Кабели, которым не хватило места по высоте лотка, в отчёте показаны отдельно, а не пропускаются молча.

  Марки кабелей внутри каждого участка перенумеровываются по порядку появления в файле (у каждого участка своя нумерация с 1). Рядом с сечением — сводная таблица (марка/система/диаметр/кол-во) и реальный % заполнения лотка по факту уложенных кабелей.

  Откройте чертёжный вид и нажмите кнопку — дальше файл .xlsx, участки (можно выбрать несколько — построятся в ряд слева направо от одной точки, не внахлёст), показывать ли марки и таблицу, и точку вставки скрипт спросит сам.
