title: "Соединить лотки\nпод углом"
tooltip: >-
  Выберите два кабельных лотка с концами на разных уровнях. Введите угол наклонного участка к горизонту от 2 до 88 градусов. Кнопка создаёт новый участок лотка и штатные соединительные детали, сохраняя выбранные лотки на месте.
title_en: "Connect trays\nat an angle"
tooltip_en: >-
  Select two cable trays with ends at different elevations. Enter the angle of the sloped segment to horizontal from 2 to 88 degrees. The button creates a new tray segment and native fittings while leaving the selected trays in place.
