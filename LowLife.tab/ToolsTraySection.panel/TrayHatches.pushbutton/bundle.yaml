title: Лючки на уровнях
tooltip: |
  Ставит лючки там, где кабельные лотки проходят через уровни: семейство, в имени типа которого есть «лючок» (настраивается), с размерами лотка плюс запас (по умолчанию 50 мм).

  Берёт выделенные лотки, а если ничего не выделено — все лотки модели. Ширина лючка идёт вдоль ширины лотка, длина — вдоль его высоты; у наклонного лотка длина — по косому сечению уровнем. Повторный запуск обновляет размер и поворот уже стоящих лючков, а не ставит копии.

  Shift+клик — настройки: часть имени типа, параметры ширины и длины лючка, запас, смещение от уровня.
