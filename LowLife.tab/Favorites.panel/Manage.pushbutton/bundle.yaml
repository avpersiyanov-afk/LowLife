title: Избранное
tooltip: >-
  Свои панели из кнопок LowLife: создайте панель, найдите кнопки по названию и добавьте их — панели
  появятся на вкладке LowLife сразу за этой и видны при любой теме. Кнопка избранного запускает ту же
  команду, что исходная (Shift+клик — тоже). Добавить кнопку можно и из окна «Поиск» — «В избранное».
context: zero-doc
