tooltip: |
  Лоток СПЗо (Лотки на кровле, Перфорированный) — делает активным рабочий набор лотков (по умолчанию «КНК») и запускает вставку лотка типа, в имени которого есть (по умолчанию) «СПЗо_ЛП_1.5_ГЦ». Shift+клик — общие настройки всех кнопок лотков (рабочий набор и имена типов).
title_en: "Tray\nSPZo"
tooltip_en: >-
  SPZo tray (roof trays, perforated) — makes the tray workset active (by default «КНК») and starts
  placing a tray of the type whose name contains (by default) «СПЗо_ЛП_1.5_ГЦ». Shift+click — shared
  settings of all tray buttons (workset and type names).
