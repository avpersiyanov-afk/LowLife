title: Нарисовать короб
title_en: Draw enclosure
tooltip: Рисовать короб FIREBOX или ОСК штатным инструментом Revit с предпросмотром, привязками и временными размерами. Сечение задаётся в настройках. Esc завершает рисование. Shift+клик — настройки.
tooltip_en: Draw a FIREBOX or OSK enclosure with Revit's native preview, snaps and temporary dimensions. Configure the section in settings. Esc finishes drawing. Shift+click opens settings.
