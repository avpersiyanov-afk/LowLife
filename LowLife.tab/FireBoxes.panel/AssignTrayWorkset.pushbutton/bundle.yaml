title: "Назначить всем\nлоткам РН"
title_en: "Assign workset\nto all trays"
tooltip: >-
  Находит в модели все кабельные лотки и соединительные детали и назначает им рабочий набор «2_КНК».
tooltip_en: >-
  Finds every cable tray and cable-tray fitting in the model and assigns workset "2_КНК" to them.
