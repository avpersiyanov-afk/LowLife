title: "Короб на\nлотки"
title_en: "Enclosure on\ntrays"
tooltip: Выберите кабельные лотки и соединительные детали. Создать вокруг них огнезащитный короб по сохранённым настройкам и сразу отметить элементы параметром Да/Нет «как элемент в ОКК». Shift+клик — настройки.
tooltip_en: Select cable trays and fittings. Create a fire enclosure around them from the saved settings and immediately mark the elements with the Yes/No OKK parameter. Shift+click — settings.
