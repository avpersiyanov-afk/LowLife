title: "Короб на\nлотки"
title_en: "Enclosure on\ntrays"
tooltip: Выберите кабельные лотки. Создать вокруг них короб по сохранённым настройкам, используя их фактические размеры, и сразу отметить лотки и соединительные детали параметром Да/Нет ОКК.
tooltip_en: Select cable trays. Create a fire enclosure from the saved settings using their actual dimensions, then mark the trays and connected fittings with the configured Yes/No OKK parameter.
