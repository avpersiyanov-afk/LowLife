title: Настройки короба
title_en: Enclosure settings
tooltip: FIREBOX или ОСК, огнестойкость и тип короба. В каждой строке — тип, ширина и высота лотка. Разрез показывает размещение лотков, размеры, шпильки и траверсы по АТР ОСК-90/180.
tooltip_en: FIREBOX or OSK, fire resistance and enclosure type. Each row contains tray type, width and height. The section shows tray positions, dimensions, rods and crossbars using the OSK-90/180 ATRs.
