title: Настройки короба
title_en: Enclosure settings
tooltip: FIREBOX или ОСК, огнестойкость, тип короба, тип лотка, количество, размеры и расположение внутренних лотков. Схема с размерами обновляется при редактировании.
tooltip_en: FIREBOX or OSK, fire resistance, enclosure and tray types, number, dimensions and arrangement of internal trays. The dimensioned diagram updates as you edit.
