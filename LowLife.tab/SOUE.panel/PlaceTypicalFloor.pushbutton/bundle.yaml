tooltip: |
  Расстановка оповещателей СОУЭ по всем помещениям связей АР на отмеченных уровнях: в каждой квартире (лоте) — один на стене прихожей (или в первом найденном помещении из списка в настройках); во всех остальных помещениях, кроме исключённых, — количество и места по акустическому расчёту (уровень не ниже шума + 15 дБ на высоте 1,5 м): настенные, а при подвесном потолке — потолочные. SPL и мощность — из параметров оповещателя, уровень шума — из таблицы помещений объекта (справочник категорий; выгрузка и загрузка Excel). Перед расстановкой старые экземпляры выбранных типов на отмеченных уровнях удаляются.

  Shift+клик — настройки (типы оповещателей, таблица помещений: шум и исключения, параметры).
