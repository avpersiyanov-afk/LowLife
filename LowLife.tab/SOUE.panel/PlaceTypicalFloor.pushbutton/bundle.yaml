tooltip: |
  Расстановка оповещателей СОУЭ на типовом этаже по помещениям связи АР: в каждой квартире (лоте) — один на стене прихожей (или в первом найденном помещении из списка в настройках), в коридорах МОП и лифтовых холлах — по одному на помещение или с заданным шагом. Для квартир, коридоров и лифтовых холлов — свой тип оповещателя, установка на стену или на потолок и высота от уровня. Перед расстановкой старые экземпляры выбранных типов на отмеченных уровнях удаляются.

  Shift+клик — настройки (семейства и типы, установка, высоты, помещения, параметры).
