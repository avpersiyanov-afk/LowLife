tooltip: |
  Расстановка оповещателей СОУЭ по всем помещениям связей АР на отмеченных уровнях: в каждой квартире (лоте) — один на стене прихожей (или в первом найденном помещении из списка в настройках); во всех остальных помещениях, кроме исключённых, — количество, места и сам оповещатель с отводом мощности по акустическому расчёту (уровень не ниже шума + 15 дБ на высоте 1,5 м): настенные на стены и колонны, а при подвесном потолке — потолочные. Оповещатель подбирается из всех типов проекта с параметрами SPL/мощность/исполнение, уровень шума — из таблицы помещений объекта (справочник категорий; выгрузка и загрузка Excel). Если на отмеченных уровнях уже есть оповещатели, кнопка спросит: удалить их и расставить заново или не удалять и оснастить только помещения, где оповещателей ещё нет.

  Shift+клик — настройки (оповещатель квартир, найденные оповещатели, таблица помещений: шум и исключения, параметры).
title_en: "Voice alarm —\ntypical floor"
tooltip_en: >-
  Places voice alarm speakers in every room of the architectural links on the ticked levels: in each
  apartment (lot) — one on a hallway wall (or in the first room found from the list in the settings);
  in all other rooms except excluded ones — the number, positions and the speaker itself with its
  power tap from an acoustic calculation (level at least noise + 15 dB at a height of 1.5 m): wall
  speakers on walls and columns, and ceiling speakers where there is a suspended ceiling. The speaker
  is chosen from all project types with SPL/power/version parameters; the noise level comes from the
  project's room table (a category catalog; Excel export and import). If there are already speakers on
  the ticked levels, the button asks whether to delete them and place again, or keep them and equip
  only rooms that have no speakers yet. Shift+click — settings (apartment speaker, found speakers,
  room table: noise and exclusions, parameters).
