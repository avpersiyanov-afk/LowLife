tooltip: |
  Расстановка оповещателей СОУЭ на типовом этаже по помещениям связи АР: в каждой квартире (лоте) — один на стене прихожей (или в первом найденном помещении из списка в настройках), в коридорах МОП и лифтовых холлах — количество и места по акустическому расчёту (уровень не ниже шума + 15 дБ на высоте 1,5 м). Для квартир, коридоров и лифтовых холлов — свой тип оповещателя, установка на стену или на потолок; потолок определяется сам — подвесной (оповещатель в его плоскость) или перекрытие (свой тип под плитой). Перед расстановкой старые экземпляры выбранных типов на отмеченных уровнях удаляются.

  Shift+клик — настройки (семейства и типы, установка, высоты, акустический расчёт, помещения, параметры).
