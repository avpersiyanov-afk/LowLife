tooltip: Загружает семейства из папки-каталога .rfa в модель. Сначала — выбор разделов каталога (папок с .rfa; можно несколько, Отмена = все), затем сортируемая таблица по файлам с галочками — имя файла, папка, есть ли уже в модели, дата файла. Зелёным — новые, серым — уже загруженные (будут перезагружены с заменой параметров типов). Отмеченные семейства грузятся в модель целиком, затем для семейств с несколькими типоразмерами открывается окно отбора типов — снятые типоразмеры удаляются из модели, а если снять все типы семейства, удаляется само семейство (окно «Закрыть» — ничего не удалять). Загруженным семействам ставится скрытая метка даты каталога (её потом читает кнопка «Семейства из каталога»). Флажок «заменять значения параметров типоразмеров» влияет только на семейства, уже присутствующие в модели (как выбор в диалоге браузера). Путь к каталогу общий с кнопкой «Семейства из каталога»; Shift+клик — сменить папку.
