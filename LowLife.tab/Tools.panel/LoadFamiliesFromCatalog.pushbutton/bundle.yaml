tooltip: Загружает семейства из папки-каталога .rfa в модель. Сначала — выбор разделов каталога (папок с .rfa; можно несколько, Отмена = все), затем сортируемая таблица по файлам с галочками — имя файла, папка, есть ли уже в модели, дата файла. Зелёным — новые, серым — уже загруженные (будут перезагружены с заменой параметров типов). Дальше для отмеченных файлов открывается каждый .rfa, читается список типоразмеров, и в следующем окне отмечаются нужные типы (семейства с одним типоразмером грузятся сразу). Грузятся только отмеченные типоразмеры (LoadFamilySymbol); если отмечены все типы семейства — оно грузится целиком. Загруженным семействам ставится скрытая метка даты каталога (её потом читает кнопка «Семейства из каталога»). Флажок «заменять значения параметров типоразмеров» влияет только на семейства, уже присутствующие в модели (как выбор в диалоге браузера). Путь к каталогу общий с кнопкой «Семейства из каталога»; Shift+клик — сменить папку.
