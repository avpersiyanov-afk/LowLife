tooltip: |
  Поворачивает 3D вид вокруг оси на точный угол — в Revit 3D вид вращается только мышью и видовым кубом. Выберите 3D вид (по умолчанию — активный), ось поворота — X, Y или Z модели (проходят через центр рамки 3D вида, без рамки — через центр вида) или ось сетки — и угол в градусах (кнопки ±45°, ±90°, 180° или любое число). Модель в кадре поворачивается против часовой стрелки, если смотреть с конца оси (минус — по часовой). Окно не закрывается после поворота — вид можно доворачивать по шагам. Работает и с перспективными видами; заблокированный вид сначала разблокируйте.
