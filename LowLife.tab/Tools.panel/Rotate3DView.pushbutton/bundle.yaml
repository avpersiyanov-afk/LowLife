tooltip: |
  Поворачивает открытый 3D вид под ось: кликните на виде ось сетки (или прямую линию, стену, лоток — в модели или в связанном файле), и вид развернётся вокруг вертикали так, чтобы смотреть вдоль или поперёк этой оси (ближайший из четырёх поворотов, наклон камеры не меняется). Включённая рамка 3D вида поворачивается так же — её стороны встают параллельно оси. Можно кликать следующие оси подряд; Esc — выход. Заблокированный 3D вид сначала разблокируйте.
