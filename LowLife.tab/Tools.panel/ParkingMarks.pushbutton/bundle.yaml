tooltip: |
  Отмечает на плане элементы категории «Парковка» из связей: у каждого машиноместа — отметку верха. Если в «Комментариях» элемента есть слово «зона» (список слов — в настройках), это зона: отмечаются её верх и низ, а контур заливается штриховкой. Берутся элементы связей, видимых на плане, от глубины просмотра до секущей плоскости и в пределах подрезки. Отметка — высотная отметка Revit на грани элемента связи (тип «LowLife — отметки парковки»), где Revit её не принял — текст. Повторный запуск заменяет отметки и штриховку прошлого запуска на плане.

  Shift+клик — настройки этой кнопки.
