tooltip: |
  Подписывает на плане отметки элементов категории «Парковка» из связей — от уровня плана (пол этажа = ±0,000). Элементы делятся на группы по словам в «Комментариях», имени рабочего набора и имени семейства/типа (по порядку, элемент попадает в первую подошедшую): зона светильников («светильн») — низ и верх, контур заштрихован; проезд («проезд») — верх, штриховка; машиноместо («машиномест») — верх, штриховка; остальные — верх. Подписи, попавшие в одно место плана, объединяются в одну. Берутся связи, видимые на плане, элементы между уровнем плана и следующим уровнем, в пределах подрезки. Повторный запуск заменяет подписи и штриховку прошлого запуска.

  Shift+клик — настройки: слова, тексты подписей и штриховка для каждой группы.
