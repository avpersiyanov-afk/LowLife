tooltip: Переименовывает файлы выгрузки Revit/ModPlus — в имени каждого файла меняет «0000» на «000» (по умолчанию). Нужно, когда два листа идут под одним номером, но с разными именами: листам дают разные номера («0000» и «000»), а после выгрузки приводят к одному. Обычный клик — спросить папку выгрузки (подставляется прошлый путь), показать список и переименовать; в модели ничего не меняется. После команды ModPlus «Экспорт» тот же диалог появляется сам (хук command-after-exec). Shift+клик — настройки: автозапуск, подстрока-триггер команды, что на что менять, расширения, подпапки.
