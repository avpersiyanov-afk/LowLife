tooltip: |
  Сравнивает уровни и оси модели с уровнями и осями связи КФП и показывает список в окне pyRevit: что совпадает, что расходится (отметка уровня, смещение или поворот оси), что названо по-другому и чего нет в модели или в связи. Связь берётся по слову в имени («КФП»), иначе — выбор из списка. Координаты связи — с учётом её размещения. Модель не меняет.

  Shift+клик — настройки (слово в имени связи, допуск в мм).
title_en: "Grids and levels\nvs coordination"
tooltip_en: >-
  Compares the model's levels and grids with those of the coordination (КФП) link and lists in the
  pyRevit window what matches, what differs (level elevation, grid offset or rotation), what's named
  differently and what's missing from the model or the link. The link is found by a word in its name
  («КФП»), otherwise picked from a list. Link coordinates take its placement into account. Doesn't
  change the model. Shift+click — settings (word in the link name, tolerance in mm).
