tooltip: |
  Сравнивает уровни и оси модели со связью КФП. После отчёта предлагает выбрать недостающие элементы, тип семейства и рабочий набор отдельно для уровней и осей и открыть штатное Копирование/Мониторинг. Создаются 3D-вид выбранных уровней и план выбранных осей. Связь и элементы нужно выбрать на подготовленном виде Revit. После завершения новые копии со штатным мониторингом настраиваются и закрепляются.

  Shift+клик — настройки (слово в имени связи, допуск в мм).
title_en: "Grids and levels\nvs coordination"
tooltip_en: >-
  Compares model levels and grids with the coordination link. After the report, select missing
  elements and a host family type and workset separately for levels and grids, then open native
  Copy/Monitor. A 3D view for selected levels and a plan for selected grids are created. Pick the link and elements in the prepared view. After finishing, new copies with
  native monitoring are configured and pinned.
  Shift+click — settings (word in the link name, tolerance in mm).
engine:
  persistent: true
