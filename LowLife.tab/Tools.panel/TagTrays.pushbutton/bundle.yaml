tooltip: |
  Ставит и раскладывает марки кабельных лотков на активном виде ровно и без пересечений — так же, как «Марки оборудования». Два режима (кнопка спрашивает; если выделены только марки — сразу первый):
  «Разложить выбранные марки» — двигаются только выбранные марки лотков (у выбранного лотка — все его марки на виде), новые не создаются.
  «Поставить марки на лотки» — на выбранные лотки без марки на виде ставится марка (тип выбирается списком, если их несколько; выбор запоминается) и сразу раскладывается. Соединительные детали не маркируются (и не выбираются), лотки под наклоном и вертикальные — пропускаются.
  Марка смотрит в середину видимой части лотка, выноска — от края лотка, полка — ровно на уровне марки.

  Shift+клик — настройки: отступ, зазор между марками, длина полки, что считать «рядом» (мм на листе), допуск наклона (градусы).
title_en: "Tray\ntags"
tooltip_en: >-
  Places and arranges cable tray tags in the active view neatly and without overlaps — the same way as
  «Equipment tags». Two modes (the button asks; if only tags are selected — the first one right away):
  «Arrange selected tags» — only the selected tray tags move (for a selected tray — all its tags in
  the view), no new ones are created. «Tag trays» — selected trays without a tag in the view get one
  (the type is picked from a list if there are several; the choice is remembered), arranged right
  away. Fittings aren't tagged (or picked); sloped and vertical trays are skipped. The tag points to
  the middle of the visible part of the tray, the leader starts at the tray edge, and the shoulder is
  exactly level with the tag. Shift+click — settings: offset, gap between tags, shoulder length, what
  counts as «nearby» (mm on the sheet), slope tolerance (degrees).
