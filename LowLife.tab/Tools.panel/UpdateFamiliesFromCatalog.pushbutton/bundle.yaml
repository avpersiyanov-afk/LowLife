tooltip: Обновляет загружаемые семейства выбранной категории из папки-каталога .rfa. Рекурсивно (с подпапками, кроме папок с «архив» в имени) ищет в каталоге файл с самым похожим именем на каждое семейство модели, показывает таблицу сопоставления с галочками (можно вручную сменить файл), и для отмеченных выполняет перезагрузку семейства из файла с заменой значений параметров типов (overwrite parameter values). Файл каталога с другим именем всё равно обновит нужное семейство, а не создаст новое. Путь к каталогу запоминается между запусками; Shift+клик по кнопке — сменить папку. Document.LoadFamily идёт вне общей транзакции, поэтому каждая перезагрузка — отдельный шаг отмены.
