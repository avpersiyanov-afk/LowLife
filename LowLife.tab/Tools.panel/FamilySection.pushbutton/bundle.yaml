tooltip: |
  Строит разрез по выбранному семейству, сразу обрезанный (отступы по умолчанию, меняются в настройках): по высоте — от базового уровня семейства до следующего этажа того же корпуса (по имени уровня Дисциплина_Корпус_Отметка_Этаж_Комментарий; уровни других корпусов на разрезе скрываются), по ширине — 2000 мм слева и справа от геометрии семейства, по глубине — плоскость сечения в 100 мм перед геометрией и дальняя граница в 1000 мм за ней. Разрез смотрит на лицевую сторону семейства; для устройств на стене (в т.ч. на грани) — со стороны помещения. Линейные элементы и системные семейства (кабельные лотки, короба, трубы, воздуховоды, стены) тоже выбираются: разрез идёт вдоль их оси, наблюдатель — с южной стороны (для осей «север–юг» — с западной).

  Сразу назначаются шаблон вида, типоразмер разреза и имя по маске. Элементы берутся из текущего выделения, иначе предлагается выбрать их в модели. Перед построением кнопка спрашивает: при нескольких элементах — один общий разрез (границы по крайним элементам) или отдельный на каждый; и насколько опустить низ разреза ниже базового уровня (мм). Ответы запоминаются.

  Shift+клик — настройки: шаблон вида, типоразмер, маска имени, отступы подрезки, «смотреть с обратной стороны».
