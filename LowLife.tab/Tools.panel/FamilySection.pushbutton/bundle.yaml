tooltip: |
  Строит разрез по выбранному семейству, сразу обрезанный (отступы по умолчанию, меняются в настройках): по высоте — от базового уровня семейства до уровня выше, по ширине — 2000 мм слева и справа от геометрии семейства, по глубине — плоскость сечения в 100 мм перед геометрией и дальняя граница в 1000 мм за ней. Разрез смотрит на лицевую сторону семейства (FacingOrientation).

  Сразу назначаются шаблон вида, типоразмер разреза и имя по маске. Если семейства выбраны заранее — разрез строится по каждому, иначе предлагается выбрать их в модели.

  Shift+клик — настройки: шаблон вида, типоразмер, маска имени, отступы подрезки.
