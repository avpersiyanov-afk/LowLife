tooltip: |
  Собирает все кабельные лотки из связанной модели, видимые на активном виде, и выгружает список в .xlsx (Excel не нужен): ID лотка в связанном файле, имя типа, модель, отметка (середина, мм), базовый уровень, имя связи. Если на виде несколько связей — спросит, из каких собирать. В Revit 2024+ видимость берётся точно по виду; в более старых — по подрезке и диапазону вида.
