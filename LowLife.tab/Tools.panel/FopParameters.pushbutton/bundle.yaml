tooltip: |
  Показывает список общих параметров, нужных кнопкам LowLife (СКС, СКУД, СПС, СОУЭ, СПА, СОТ), с примером имени, типом данных и категориями. Имена можно поменять под соглашение проекта; отмеченные параметры создаются в файле общих параметров (ФОП) — если их там ещё нет — и сразу привязываются к нужным категориям проекта. Введённые имена вписываются в настройки кнопок.
