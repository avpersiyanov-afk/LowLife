tooltip: |
  Ищет в модели справочник кабелей — ключевую спецификацию категории «Электрические цепи», на строки которой ссылается параметр цепи «Проводник». Выводит список всех ключевых спецификаций проекта (какие из них признаны справочником кабелей), а для справочника — таблицу строк: ключевое имя, ID, столбцы спецификации и число цепей, где строка уже проставлена. Этот же поиск используют окна выбора проводника в настройках СКС/СКУД/СПС/СОУЭ/СПА.
