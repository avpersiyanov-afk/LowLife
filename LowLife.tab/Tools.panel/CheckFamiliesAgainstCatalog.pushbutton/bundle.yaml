tooltip: Проверяет актуальность семейств выбранной категории относительно папки-каталога .rfa. Читает скрытую метку даты (ExtensibleStorage), которую ставит кнопка «Обновить семейства», и сравнивает её с текущей датой изменения похожего файла в каталоге (папки с «архив» в имени пропускаются). Выводит четыре списка — устаревшие (файл каталога новее метки), без метки (не обновлялись этой кнопкой), без похожего файла в каталоге, актуальные. Модель не меняет. Путь к каталогу общий с кнопкой «Обновить семейства»; Shift+клик — сменить папку.
