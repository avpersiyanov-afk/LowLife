tooltip: Проверяет актуальность семейств выбранной категории относительно папки-каталога .rfa. Читает скрытую метку даты (ExtensibleStorage), которую ставит кнопка «Обновить семейства», и сравнивает её с текущей датой изменения похожего файла в каталоге. Выводит списки: устарели (файл новее метки), без метки (не обновлялись), нет похожего файла в каталоге, актуальны. Модель не меняет. Путь к каталогу общий с кнопкой «Обновить семейства»; Shift+клик — сменить папку.
