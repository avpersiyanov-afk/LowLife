tooltip: Открывает окно с сортируемой таблицей по семействам выбранной категории — имя, статус (зелёным «актуально», красным «устарело», оранжевым «нет метки»), дата в модели и дата похожего файла в каталоге .rfa, похожесть имени. Статус считается по скрытой метке даты (ExtensibleStorage), которую ставит обновление, и текущей дате файла каталога (папки с «архив» в имени пропускаются). Отмеченные галочкой семейства можно тут же обновить (перезагрузка с заменой параметров, при различии имён — переименование по файлу каталога). Если просто закрыть окно — ничего не меняется. Путь к каталогу общий с кнопкой «Обновить семейства»; Shift+клик — сменить папку.
