tooltip: |
  Проверяет орфографию, грамматику и пунктуацию в текстовых заметках модели с помощью ИИ (Claude или ChatGPT — подключение то же, что у «Задач из почты»). Одинаковые надписи отправляются один раз; найденные исправления показываются списком «было → стало», записываются только отмеченные. Меняются только исправленные слова — форматирование заметки сохраняется.

  Область: выделенные заметки, текущий вид или вся модель.

  Shift+клик — настройки: способ подключения ИИ, модель, промпт.
