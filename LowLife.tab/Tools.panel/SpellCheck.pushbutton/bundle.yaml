tooltip: |
  Проверяет заметки, названия листов, штампы, типовые аннотации и ручные спецификации с помощью ИИ. Параметры оборудования и других модельных семейств не обходятся. Подключение то же, что у «Задач из почты». Исправления показываются списком «было → стало», записываются только отмеченные. Форматирование заметок сохраняется.

  Область: выделенные элементы, текущий вид или вся модель. Правка параметра типа затрагивает все его экземпляры.

  Shift+клик — настройки: способ подключения ИИ, модель, промпт.
title_en: "Spell\ncheck"
tooltip_en: >-
  Checks text notes, sheet names, title blocks, generic annotations and manual schedule headers with AI.
  Equipment and other model family parameters are excluded.
  The connection is shared with «Tasks from mail». Corrections are previewed and only checked items
  are applied. Note formatting is preserved. Scope: selected elements, current view or whole model.
  Editing a type parameter affects all instances of that type.
  Shift+click — settings: how to connect the AI, model, prompt.
