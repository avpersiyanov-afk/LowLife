tooltip: |
  Выравнивает секущий диапазон планов: низ и глубина вида — уровень плана со смещением 0, секущая плоскость — уровень плана +1200 мм, верх — уровень следующего этажа −200 мм. Следующий этаж определяется по имени уровня, как в «Разрезе по семейству» (тот же корпус, другой этаж; шаблон имени уровня — в настройках «Разреза по семейству», Shift+клик по той кнопке); если выше уровней нет — верх «Неограниченно». Работает с планами, выделенными в Диспетчере проекта, а если их нет — с активным видом. Планы потолков и планы, у которых диапазон задаёт шаблон вида, пропускаются с пояснением.
