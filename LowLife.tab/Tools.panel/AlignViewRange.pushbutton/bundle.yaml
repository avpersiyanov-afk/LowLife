tooltip: |
  Выравнивает секущий диапазон планов: низ и глубина вида — уровень плана со смещением 0, секущая плоскость — уровень плана +1200 мм (если до следующего этажа меньше 1400 мм — +900 мм), верх — уровень следующего этажа −200 мм. Следующий этаж определяется по имени уровня (тот же корпус, другой этаж) — по шаблону имени уровня из настроек кнопки (Shift+клик), например «{Дисциплина}_{Корпус}_{Отметка}_{Этаж}_{Комментарий}» или «Этаж {Этаж}»; если выше уровней нет — верх «Неограниченно». Работает с планами, выделенными в Диспетчере проекта, а если их нет — с активным видом. Планы потолков и планы, у которых диапазон задаёт шаблон вида, пропускаются с пояснением.
