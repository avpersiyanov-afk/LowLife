tooltip: |
  Создаёт планы по уровням: для каждого выбранного уровня — по виду каждой выбранной группы видов. У группы (Shift+клик — настройки) свои тип вида, маска имени ({Уровень}, {Этаж}, {Корпус}, {Комментарий}, {Отметка}, {Группа}), шаблон вида, секущий диапазон (верх — от следующего этажа, секущая/низ/глубина — от уровня вида; пустое поле — не менять) и, по желанию, связанные модели «По связанному виду»: перед созданием открывается окно, где для каждого уровня и каждой связи выбирается план связи из списка под фильтр группы («Начинается с», «Содержит», «Заканчивается на», «Не содержит», «Равно», регулярное выражение); заранее подставлен выбранный в прошлый раз или план на ближайшем по отметке уровне (Revit 2024+, шаблон не должен управлять связями RVT). Вид с тем же именем на том же уровне не создаётся заново — ему заново назначаются шаблон, диапазон и связи.
