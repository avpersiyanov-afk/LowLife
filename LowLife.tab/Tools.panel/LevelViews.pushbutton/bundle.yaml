tooltip: |
  Создаёт планы по уровням: для каждого выбранного уровня — по виду каждой выбранной группы видов. У группы (Shift+клик — настройки) свои тип вида, маска имени ({Уровень}, {Этаж}, {Корпус}, {Комментарий}, {Отметка}, {Группа}), шаблон вида, секущий диапазон (верх — от следующего этажа, секущая/низ/глубина — от уровня вида; пустое поле — не менять) и, по желанию, связанные модели «По связанному виду»: из планов связи под фильтр группы («Начинается с», «Содержит», «Заканчивается на», «Не содержит», «Равно», регулярное выражение — например «Начинается с» «2_СС-АР») для каждого вида берётся план на таком же уровне связи — с тем же именем уровня, иначе тот же этаж, иначе ближайший по отметке; по желанию перед созданием показывается окно, где подобранное можно поменять (Revit 2024+, шаблон не должен управлять связями RVT). Вид с тем же именем на том же уровне не создаётся заново — ему заново назначаются шаблон, диапазон и связи.
