tooltip: |
  Создаёт планы для всех уровней модели по выбранным шаблонам видов: в окне отмечаете шаблоны видов, у каждого вписываете группы вида и назначения (несколько — по одной на строке, на каждую свой вид) и задаёте маску имени ({Уровень}, {Группа вида и назначение}, {Шаблон}, {Отметка}, {Этаж}, {Корпус}, {Комментарий}), по умолчанию «{Группа вида и назначение}_{Корпус}_{Этаж}_{Отметка}». Для каждого отмеченного шаблона на каждом уровне создаётся план с этим шаблоном (тип плана — по виду шаблона: этаж, потолок, несущие конструкции). С галочкой «Выровнять секущий диапазон» диапазон видов выставляется как у кнопки «Секущий диапазон» (если её настройка ещё не заполнена — она откроется перед созданием). Вид с таким же именем на том же уровне не создаётся заново — ему назначается шаблон. Маска, группы вида и назначения и отметки запоминаются.
