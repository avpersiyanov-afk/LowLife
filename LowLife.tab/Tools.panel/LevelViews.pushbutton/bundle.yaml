tooltip: |
  Создаёт планы для всех уровней модели по выбранным шаблонам видов: в окне отмечаете шаблоны видов, у каждого вписываете своё значение и задаёте маску имени ({Уровень}, {Значение}, {Шаблон}, {Отметка}, {Этаж}, {Корпус}, {Комментарий}), например «{Уровень}_{Значение}». Для каждого отмеченного шаблона на каждом уровне создаётся план с этим шаблоном (тип плана — по виду шаблона: этаж, потолок, несущие конструкции). Вид с таким же именем на том же уровне не создаётся заново — ему назначается шаблон. Маска, значения и отметки запоминаются.
