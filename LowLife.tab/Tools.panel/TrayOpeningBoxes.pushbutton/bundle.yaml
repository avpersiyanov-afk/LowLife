tooltip: |
  Ставит бокс на каждое место, где выбранный кабельный лоток проходит сквозь стену или перекрытие модели, выбранной в настройках (эта модель, одна из связей или все сразу). Семейство — загруженное, в имени семейства есть «бокс», в имени типа — «временный» (если подходящих типов несколько — кнопка спросит).
  Размер бокса — сечение лотка плюс 50 мм (по ширине и по высоте), глубина — по толщине стены/перекрытия. В стене бокс повёрнут вдоль стены, в перекрытии — вдоль лотка. Сквозь стены — только горизонтальные лотки, сквозь перекрытия — только вертикальные.
  Повторный запуск не ставит дубли: у бокса, уже стоящего на том же месте, обновляются размеры.

  Shift+клик — настройки: слова в именах семейства/типа, имена параметров размеров, запас, модель, где искать пересечения (эта / связь / все), что пересекать, точка вставки семейства.
