tooltip: |
  Ставит бокс на каждое место, где выбранный кабельный лоток проходит сквозь стену или перекрытие модели, выбранной в настройках (эта модель, одна из связей или все сразу). Семейство — загруженное, в имени семейства есть «бокс», в имени типа — «временный» (если подходящих типов несколько — кнопка спросит). Боксы создаются в рабочем наборе, в имени которого есть «боксы».
  Размер бокса — сечение лотка плюс 50 мм (по ширине и по высоте), глубина — по толщине стены/перекрытия. В стене бокс повёрнут вдоль стены, в перекрытии — вдоль лотка. Сквозь стены — только горизонтальные лотки, сквозь перекрытия — только вертикальные.
  Если на пересечении бокс уже есть, новый не создаётся (стоящий не меняется) — кнопка предупреждает об этом.

  Shift+клик — настройки: слова в именах семейства/типа и рабочего набора, имена параметров размеров, запас, модель, где искать пересечения (эта / связь / все), что пересекать, точка вставки семейства.
