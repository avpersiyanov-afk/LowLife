tooltip: |
  Показывает и копирует в буфер обмена ID выбранного элемента — в том числе элемента, выбранного внутри связанной модели (для него показывается ID именно в связанном файле, а не ID экземпляра связи). При нескольких выбранных элементах список ID копируется через запятую — его можно вставить в диалог Revit «Select Elements by ID».
title_en: "Element\nID"
tooltip_en: >-
  Shows and copies to the clipboard the ID of the selected element — including an element selected
  inside a linked model (for it, the ID in the linked file is shown, not the ID of the link instance).
  With several elements selected, the list of IDs is copied comma-separated — it can be pasted into
  Revit's «Select Elements by ID» dialog.
