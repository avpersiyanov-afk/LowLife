tooltip: |
  Обрезает вид и аннотации по прямоугольнику: укажите мышью два противоположных угла, затем выберите, что обрезать — этот вид или его копию (простую, с детализацией или зависимую; в конец имени копии добавляется текст). Включаются подрезка вида и подрезка аннотаций (с минимальным отступом от рамки), копия открывается. Работает на планах, разрезах, фасадах и узлах. Esc — отмена.
