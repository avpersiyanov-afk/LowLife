tooltip: |
  Ставит и раскладывает марки оборудования на активном виде ровно и без пересечений. Выберите оборудование (или его марки) заранее либо рамкой после нажатия. Оборудование рядом по горизонтали — марки стопкой друг над другом с прямоугольными выносками-полками; оборудование одно над другим — марки колонкой сбоку на одном отступе; одиночное — марка над ним с полкой. Сторона выбирается так, чтобы марки не легли на другие марки и оборудование, а выноски не пересекались. Недостающие марки создаются (тип марки спрашивается, если для категории загружено несколько).

  Shift+клик — настройки: отступ, зазор между марками, длина полки, что считать «рядом» (мм на листе).
