tooltip: |
  Строит дугу обхода заданного диаметра на пересечении линий детализации.

  Диаметр запрашивается один раз в начале. Затем выбирается базовая линия
  (остаётся целой), потом — одна или несколько линий, которые её обойдут:
  каждая из них разрывается в точке пересечения, и разрыв соединяется
  дугой-полуокружностью введённого диаметра. Для каждой такой линии нужно
  кликом указать сторону обхода.
