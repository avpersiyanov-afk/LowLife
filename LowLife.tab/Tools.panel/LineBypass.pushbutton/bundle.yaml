tooltip: |
  Строит дугу обхода заданного диаметра на пересечении линий детализации.

  Диаметр запрашивается один раз в начале, следом — режим: «Одиночный»
  (своя дуга ровно введённого диаметра на каждое пересечение) или
  «Множественный» (одна большая дуга на весь пучок, если вторая линия
  сразу обходит несколько базовых). Затем выбирается одна или несколько
  базовых линий (остаются целыми), потом — одна или несколько линий,
  которые их обойдут: каждая разрывается там, где пересекает базовые
  линии, по правилам выбранного режима. Перед запросом стороны обхода
  линия подсвечивается в модели — кликом нужно указать сторону, в
  которую пойдёт дуга.
