tooltip: |
  Строит дугу обхода заданного диаметра на пересечении линий детализации.

  Диаметр запрашивается один раз в начале, следом — режим: «Одиночный»
  (своя дуга ровно введённого диаметра на каждое пересечение) или
  «Множественный» (одна большая дуга на весь пучок, если вторая линия
  сразу обходит несколько базовых). Базовые линии (остаются целыми) и
  вторые линии (которые их обойдут) выбираются кликом одна за другой без
  отдельного подтверждения «Готово» — Esc заканчивает выбор. Сторона
  обхода указывается одним кликом сразу на весь набор линий. Обход
  сначала строится как предпросмотр прямо в модели — можно кликнуть
  другую точку, чтобы перестроить с другой стороной, и только потом
  подтвердить.
