tooltip: |
  Строит дугу обхода заданного диаметра на пересечении линий детализации.

  Диаметр запрашивается один раз в начале. Затем выбирается одна или
  несколько базовых линий (остаются целыми), потом — одна или несколько
  линий, которые их обойдут: каждая разрывается там, где пересекает
  базовые линии, и разрыв соединяется дугой. Если линия пересекает сразу
  несколько базовых (обходит пучок линий), строится одна большая дуга на
  все эти пересечения. Перед запросом стороны обхода линия подсвечивается
  в модели — кликом нужно указать сторону, в которую пойдёт обход.
