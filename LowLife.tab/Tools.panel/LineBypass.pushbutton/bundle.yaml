tooltip: |
  Строит дугу обхода заданного диаметра на пересечении линий детализации.

  Диаметр запрашивается один раз в начале, следом — режим: «Одиночный»
  (своя дуга ровно введённого диаметра на каждое пересечение) или
  «Множественный» (одна большая дуга на весь пучок, если вторая линия
  сразу обходит несколько базовых). Базовые линии выбираются одним
  выбором (рамкой и/или кликами, Enter/«Готово» — подтвердить) — остаются
  целыми. Дальше — цикл: клик по линии, которая обойдёт базовые, сразу
  клик стороны обхода — обход строится этим же кликом, без предпросмотра.
  Цикл возвращается к выбору следующей линии; Esc на выборе линии
  заканчивает работу кнопки, Esc на выборе стороны пропускает только эту
  линию.
