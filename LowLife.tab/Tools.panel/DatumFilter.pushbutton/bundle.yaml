title: Фильтр осей и уровней
title_en: Grids and levels filter
tooltip: >-
  Закрепляемая немодальная панель. Галочками показывайте и скрывайте группы осей
  на обычном виде или уровней на 3D-виде. Группы формируются по маске имени.
  Изменяется только текущий вид. Shift+клик — настройки масок.
tooltip_en: >-
  Dockable modeless panel. Use checkboxes to show or hide grid groups on regular views
  or level groups on 3D views. Groups are derived from name masks.
  Only the current view changes. Shift+click opens mask settings.
engine:
  persistent: true
