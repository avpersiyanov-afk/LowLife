tooltip: |
  Приближает вид к элементу. Если элемент уже выбран в модели — просто зумирует к нему (к нескольким выбранным — к их общему габариту), в том числе к элементам связей, выбранным через Tab. Если ничего не выбрано — спрашивает ID элемента и ищет его в модели и во всех загруженных связях (если такой ID есть в нескольких — предлагает выбрать). Если элемента не видно на активном виде, подсказывает, на какой уровень (план/разрез/3D) переключиться, чтобы он был заметен.
