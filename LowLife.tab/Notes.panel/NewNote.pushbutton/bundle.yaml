title: Заметка
tooltip: >-
  Быстро записать замечание, задачу или напоминание по текущему проекту.
  Код проекта, вид и выбранные элементы подставляются из модели.
# Постоянный движок: заметка отправляется в фоне уже после закрытия окна (pnotes.core.send_queue_detached),
# и поток не должен обрываться вместе со скриптом кнопки.
engine:
  persistent: true
