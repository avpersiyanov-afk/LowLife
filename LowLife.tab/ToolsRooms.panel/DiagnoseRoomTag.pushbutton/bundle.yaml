tooltip: |
  Временная диагностика: выделите одну марку помещения (RoomTag) и нажмите — покажет, что видит по ней логика кнопки «Марки помещений» (TaggedRoomId, площадь/точку помещения, положение головы относительно границ помещения и т.д.). Нужна, чтобы разобраться, почему конкретная марка так и остаётся «?».
