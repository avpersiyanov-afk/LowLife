tooltip: |
  Экспликация помещений по обрезанному плану (фрагменту). Берёт помещения модели и видимых связей, чья точка размещения попадает в рамку подрезки активного плана, и создаёт спецификацию-таблицу: номер, наименование, площадь, категория. Таблица свободная — без параметров в модели и без фильтров. Если у плана экспликация уже есть — она обновляется (то же делает кнопка «Обновить экспликацию»).

  Shift+клик — настройки: название, заголовки и ширины граф, высота строк (по умолчанию — форма 2 ГОСТ 21.501: 15/80/20/10 мм, шапка 20, строка 8), параметр категории, знаки площади.
