tooltip: |
  Экспликация помещений по обрезанному плану (фрагменту). Берёт помещения модели и видимых связей, чья точка размещения попадает в рамку подрезки активного плана, и создаёт ключевую спецификацию: номер, наименование, площадь, категория — без настройки фильтров. Повторный запуск на том же виде обновляет эту же спецификацию.

  Shift+клик — настройки: заголовки и ширины столбцов (по умолчанию — форма 2 ГОСТ 21.501), параметр категории, знаки площади.
