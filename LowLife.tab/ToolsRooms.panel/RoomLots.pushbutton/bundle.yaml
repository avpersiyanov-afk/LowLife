tooltip: |
  Анализирует помещения связанной модели (АР): раскладывает их по уровням, сортирует по имени лота и номеру секции и находит двухуровневые лоты — те, у которых помещения с одинаковым именем лота стоят на двух и более уровнях. Отчёт — в окне вывода pyRevit (сначала двухуровневые лоты, затем помещения по уровням), по желанию — выгрузка в Excel. Модель не меняет.

  Shift+клик — настройки (параметры имени лота и номера секции).
