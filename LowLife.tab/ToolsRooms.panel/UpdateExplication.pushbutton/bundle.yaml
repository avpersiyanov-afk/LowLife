tooltip: |
  Пересобирает экспликации фрагментов (созданные кнопкой «Экспликация фрагмента») по текущим помещениям и настройкам. Что обновлять — по контексту: выделенные спецификации (на листе или в диспетчере проекта), открытая экспликация, экспликации открытого плана или открытого листа; иначе — все экспликации проекта (с подтверждением).
