tooltip: Расставляет и обновляет марки помещений из связанной модели на активном плане. Типоразмер марки выбирается из списка. Пересоздаёт марки, ставшие «???» после правок помещений у АР, а если помещения под маркой уже нет — удаляет непривязанную марку. На время вставки снимает подложку вида, мешающую ставить марки помещений. Shift+клик — выбрать несколько планов списком и обновить марки сразу на всех.
