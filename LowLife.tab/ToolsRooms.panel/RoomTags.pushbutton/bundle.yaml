tooltip: Расставляет и обновляет марки помещений из связанной модели на активном плане. Типоразмер марки выбирается из списка. Битые марки (показывают «?»: помещение удалено/переделано у АР, марка осиротела или помещение не окружено) пересоздаёт на месте, а если помещения под маркой уже нет — удаляет. На время вставки снимает подложку вида, мешающую ставить марки помещений. Shift+клик — выбрать несколько планов списком и обновить марки сразу на всех.
