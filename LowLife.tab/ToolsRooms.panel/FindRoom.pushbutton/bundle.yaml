tooltip: |
  Показывает список всех помещений (из текущей модели и всех подключённых связей), отсортированный по номеру и сгруппированный по параметру из настроек (например «Тип помещения»). Начните печатать номер или название — список отфильтруется. Выбор + «Подсветить» приближает активный вид к этому помещению; если оно относится к другому уровню, подскажет, на какой план переключиться.

  После подсветки список открывается снова — не нужно нажимать кнопку заново, чтобы найти следующее помещение. Список собирается один раз за сеанс Revit и держится в памяти (пункт «Обновить список» наверху — если помещения в связи изменились).

  Shift+клик — настройки (параметр группировки).
