tooltip: |
  Лоток СПЗо (Неперфорированный) — делает активным рабочий набор лотков (по умолчанию «КНК») и запускает вставку лотка типа, в имени которого есть (по умолчанию) «СПЗо_ЛН_1.5_СЦ». Shift+клик — общие настройки всех кнопок лотков (рабочий набор и имена типов).
title_en: "Tray\nSPZo"
tooltip_en: >-
  SPZo tray (solid) — makes the tray workset active (by default «КНК») and starts placing a tray of
  the type whose name contains (by default) «СПЗо_ЛН_1.5_СЦ». Shift+click — shared settings of all
  tray buttons (workset and type names).
