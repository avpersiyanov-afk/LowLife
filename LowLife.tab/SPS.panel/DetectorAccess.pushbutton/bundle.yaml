tooltip: |
  Проверяет, можно ли добраться до пожарных извещателей с пола: под извещателем есть пол этажа (не шахта, не проём), извещатель не над подвесным потолком и не ближе 500 мм к стене (границе помещения), а в цилиндре «зоны доступа» (круг в плане, по умолчанию радиус 500 мм) от пола до извещателя нет инженерных сетей — воздуховодов, труб, лотков, коробов, их деталей и оборудования, в модели и в связях.

  На выбранных планах зона доступа каждого извещателя обводится кругом: зелёным — доступен, красным — нет, с подписью причины. Для недоступного ищется ближайшее место в том же помещении, где зона свободна, есть пол и та же поверхность установки, — там рисуется зелёный круг, стрелка переноса и подпись «Перенести ПИ на … мм». Повторный запуск заменяет графику прошлого запуска на плане. Недоступные извещатели выделяются.

  Если перед запуском выделены извещатели — проверяются только они.

  Shift+клик — настройки этой кнопки.
