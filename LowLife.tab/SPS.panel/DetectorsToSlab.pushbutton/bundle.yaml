tooltip: |
  Переносит пожарные извещатели (категория «Пожарная сигнализация», отбор по словам в имени семейства/типа — дымовые, тепловые и т. п., без ручных) на низ перекрытия над каждым из них. Перекрытие ищется лучом вверх от уровня извещателя, с элементами связей АР/КР, поэтому разные отметки перекрытий в здании учитываются сами. Встраиваемые (в имени семейства/типа есть «встраив») ставятся не на перекрытие, а на низ подвесного потолка; без потолка над ними — не переносятся. Какие извещатели переносить, выбирается при запуске: выделенные (если перед запуском что-то выделено), все на активном виде или все на уровнях выбранных планов. При переносе с активного плана он же и подписывается.

  На выбранных планах каждая плита над этажом заливается штриховкой по своему контуру, цвет — по высоте низа плиты от пола, внутри подпись «Пер. +4,400» и разница с типовой высотой («Δ +0,650»), так что перепад виден по смене цвета. Там, где плита меняет отметку, рисуется толстая красная линия детализации (стиль «LowLife — перепад плиты»). Помещения с подвесным потолком обводятся областью заливки с подписью «ПП +2,700» (высота потолка от пола). Лестничные клетки и машиноместа не проверяются (список слов — в настройках). Повторный запуск заменяет подписи, заливки и линии прошлого запуска на плане.

  Shift+клик — настройки этой кнопки.
