tooltip: |
  Переносит пожарные извещатели (категория «Пожарная сигнализация», отбор по словам в имени семейства/типа — дымовые, тепловые и т. п., без ручных) на низ перекрытия над каждым из них. Перекрытие ищется лучом вверх от уровня извещателя, с элементами связей АР/КР, поэтому разные отметки перекрытий в здании учитываются сами. Если перед запуском выделены извещатели — переносятся только они, иначе все извещатели на уровнях выбранных планов.

  На выбранных планах в каждом помещении (из связей и модели) на уровне плана ставится подпись высоты низа перекрытия от пола («Пер. +3,300»), а там, где перекрытие выше или ниже типового для этого плана, — ещё и разница («Δ +0,450»). Там, где плита меняет отметку, рисуется толстая красная линия детализации (стиль «LowLife — перепад плиты»). Помещения с подвесным потолком обводятся областью заливки по контуру помещения с подписью «ПП +2,700» (высота потолка от пола). Повторный запуск заменяет подписи, области и линии прошлого запуска на плане.

  Shift+клик — настройки этой кнопки.
