tooltip: |
  Тестовая кнопка: выберите панель, затем несколько устройств шлейфа. Показывает категорию и электрические коннекторы каждого элемента (Domain, ConnectorType) — помогает понять, почему ElectricalSystem.Create отказывается создавать цепь заданного типа: как правило, среди переданных элементов должен быть хотя бы один категории «Электрооборудование» (OST_ElectricalEquipment) — обычные устройства (датчики и т.п.) сами по себе цепь создать не могут, только быть нагрузкой в ней.
