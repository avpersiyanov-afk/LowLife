tooltip: |
  Показывает маршрут выбранного шлейфа СПС на модели — для визуальной проверки топологии (в т.ч. ветвей от изоляторов). Выберите устройство, входящее в интересующий шлейф (если оно состоит в нескольких цепях — предложит выбрать нужную из списка). Строит временные линии (Detail Line на активном виде) по рёбрам дерева шлейфа — панель -> первое устройство и родитель -> устройство для каждого звена (не непрерывная цепочка, как у СКС/СКУД: у СПС узлом шлейфа служит само устройство, а ветви от изоляторов не возвращаются в магистраль) — и выделяет все эти устройства в модели. Вид сам масштабируется, чтобы весь шлейф поместился целиком. Линии временные: удаляются сами через несколько секунд, а также при повторном запуске кнопки (в т.ч. кнопки СКС/СКУД с той же функцией) — прошлые линии удаляются в любом случае.
