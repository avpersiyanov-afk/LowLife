tooltip: |
  Считает длину проводника для каждой цепи контроллер-устройство: по катетам (с коэффициентом запаса), если устройство рядом с контроллером, иначе по графу адресованных узлов трассы. Пишет длину в трубе/лотке раздельно, способ прокладки, марку устройств и список цепей на узлах маршрута.

  Shift+клик — настройки этой кнопки.
title_en: "Lengths\nand tags"
tooltip_en: >-
  Calculates the wire length of every controller–device circuit: along orthogonal legs (with a safety
  factor) if the device is near the controller, otherwise along the graph of addressed route nodes.
  Writes the length in conduit/tray separately, the installation method, device tags and the list of
  circuits on route nodes. Shift+click — settings for this button.
