tooltip: |
  Строит и обновляет структурную схему СКУД на отдельном чертёжном виде (имя — из настроек). Схемное семейство контроллера ставится один раз на контроллер; на каждую точку прохода подбирается группа деталей, чей состав устройств совпадает с составом точки прохода. Повторный запуск — инкрементальная синхронизация: неизменные точки прохода не трогаются (ручная раскладка сохраняется), изменившиеся перерисовываются, пропавшие удаляются. Состояние — JSON в служебном параметре вида.
