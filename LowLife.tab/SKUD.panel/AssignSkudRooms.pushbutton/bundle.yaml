tooltip: |
  Проставляет всем устройствам СКУД параметр имени помещения (как «Запись номера помещения» в СПС/СОТ), но по каждой точке прохода берёт ОДНО значение — самое частое среди её устройств — и назначает его всем устройствам этой точки прохода. Контроллерам — помещение индивидуально. Параметр-приёмник и маска берутся из настроек «Запись номера помещения» (Shift+клик).
