tooltip: |
  Проставляет всем устройствам СКУД параметр имени помещения (как «Помещение из связи» в СПС/СОТ), но по каждой точке прохода берёт ОДНО значение — самое частое среди её устройств — и назначает его всем устройствам этой точки прохода. Контроллерам — помещение индивидуально. Имена параметров берутся из «Параметры помещений».
