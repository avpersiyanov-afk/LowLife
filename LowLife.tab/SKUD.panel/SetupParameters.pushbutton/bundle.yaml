tooltip: |
  Проверяет, что все параметры СКУД привязаны в проекте к нужным категориям, и добавляет недостающие привязки из подключённого файла общих параметров (ФОП). Если определения параметра нет ни в проекте, ни в файле ФОП — ничего не выдумывает, только сообщает об этом.

  Настройки самих кнопок СКУД сюда не входят — у каждой рабочей кнопки свои настройки по Shift+клику.
