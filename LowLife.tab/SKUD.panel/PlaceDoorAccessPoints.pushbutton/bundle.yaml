tooltip: |
  Расставляет элементы точки доступа СКУД (считыватель, замок, доводчик, геркон, кнопку экстренной разблокировки, домофон, кнопку выхода) на все двери выбранных помещений активного вида. Показывает таблицу помещений с числом дверей; для каждого помещения выбирается тип точки доступа — его состав (типоразмеры по местам) расставляется по расстояниям с мнемосхемы двери, снаружи и внутри помещения.

  Shift+клик — мнемосхема двери (какие семейства могут стоять на каждом месте, расстояния, количество замков/герконов) и типы точек доступа с их составом.
