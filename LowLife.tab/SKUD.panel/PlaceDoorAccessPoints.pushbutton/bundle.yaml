tooltip: |
  Расставляет элементы точки доступа СКУД (считыватель, замок, доводчик, геркон, кнопку экстренной разблокировки, домофон, кнопку выхода) на все двери выбранных помещений активного вида. Показывает таблицу помещений с числом дверей; для каждого помещения выбирается тип точки доступа — его состав (типоразмеры по местам) расставляется по расстояниям с мнемосхемы двери, снаружи и внутри помещения.

  Shift+клик — мнемосхема двери (какие семейства могут стоять на каждом месте, расстояния, количество замков/герконов) и типы точек доступа с их составом.
title_en: "Access points\non doors"
tooltip_en: >-
  Places ACS access point elements (reader, lock, door closer, reed switch, emergency release button,
  intercom, exit button) on all doors of the selected rooms in the active view. Shows a table of rooms
  with their door count; an access point type is chosen for each room — its make-up (family types per
  position) is placed at the distances from the door layout, outside and inside the room. Shift+click
  — the door layout (which families can stand at each position, distances, number of locks/reed
  switches) and access point types with their make-up.
