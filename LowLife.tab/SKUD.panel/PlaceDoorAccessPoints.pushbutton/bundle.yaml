tooltip: |
  Расставляет элементы точки доступа СКУД (считыватель, замок, доводчик, геркон, кнопку экстренной разблокировки, домофон, кнопку выхода) на все двери выбранных помещений активного вида. Показывает таблицу помещений с числом дверей; для каждого помещения выбирается группа — из неё берутся только типы семейств (состав точки доступа), а расставляются они по расстояниям с мнемосхемы двери, снаружи и внутри помещения.

  Shift+клик — мнемосхема двери: какие семейства могут стоять на каждом месте и на каком расстоянии от края двери.
