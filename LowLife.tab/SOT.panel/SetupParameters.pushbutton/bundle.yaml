tooltip: |
  Окно настроек СОТ (охранное телевидение): имена параметров («Помещение», «Адрес устройства», «Уровень»), признак подземного этажа и таблица категорий устройств схемы — для каждой категории выбирается схемное семейство (для вставки) и реальные типы устройств модели, которые к ней относятся. Без выбора кабеля и без координат — раскладка структурной схемы полностью автоматическая.
