tooltip: |
  Строит зону обзора выбранных видеокамер на активном виде (плане этажа/потолка или чертёжном виде) как область заливки, обрезая её по границе помещения из связанной модели.

  Порядок: сначала нажать кнопку, затем выбрать камеры в модели — фильтр выбора пропускает только категорию «Охранная сигнализация».

  По каждой камере: горизонтальный угол обзора и дальность берутся из параметров экземпляра (имена — в настройках); направление — FacingOrientation семейства плюс необязательный доворот (параметр поворота отдельно не прибавляется). Если заданы параметры высоты установки, наклона оптической оси вниз и вертикального угла обзора — зона считается как проекция конуса на плоскость расчёта: ближняя мёртвая зона near = h / tg(наклон + вертикальный/2) и дальняя граница far = h / tg(наклон − вертикальный/2), дальше — обрезка дальностью.

  Обрезка по помещению: ищется Room из связи, в котором стоит камера, и каждый луч сектора укорачивается до первого пересечения с его контуром — корректно для вогнутых помещений и «дыр» (колонн, шахт). Можно отключить в настройках.

  Повторный запуск не плодит дубли: прежние зоны выбранных камер на этом виде находятся по метке в параметре «Комментарии» и создаются заново. Необязательно — концентрические дуги зон DORI (идентификация/распознавание/наблюдение/обнаружение) по разрешению матрицы.

  Настройки (все параметры расчёта, включая высоту установки) — Shift+клик по кнопке.
