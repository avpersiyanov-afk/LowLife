tooltip: |
  Подбирает и записывает наклон выбранных видеокамер так, чтобы дальний край их зоны обзора приходился на границу помещения по направлению взгляда — «Зоны обзора» этим не занимается, только рисует уже готовую зону.

  Порядок: сначала кнопка, затем выбор камер (тот же фильтр категорий, что у «Зон обзора»). Для каждой камеры: находит её помещение и расстояние до стены вдоль направления взгляда, берёт высоту установки и вертикальный угол обзора (из параметров или расчёта по оптике — те же настройки, что у «Зон обзора»), считает наклон по формуле наклон = arctg(высота / расстояние_до_стены) + вертикальный_угол/2 и записывает результат в параметр наклона.

  Параметр наклона должен быть параметром ЭКЗЕМПЛЯРА (у каждой камеры свой) — если он окажется параметром типа, кнопка откажется писать в него, чтобы не переставить наклон сразу у всех камер этого типа. Если высота или вертикальный угол не заданы ни на камере, ни оптикой — используются значения по умолчанию из настроек (Shift+клик), которые тоже записываются на камеру.

  После запуска зону нужно перестроить кнопкой «Зоны обзора» — сама эта кнопка ничего не рисует, только двигает наклон.
