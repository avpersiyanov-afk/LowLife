tooltip: |
  Диагностика для «Зоны обзора» / «Навести на помещение»: выберите одну камеру — кнопка прочитает ВСЕ параметры её экземпляра и типа и проверит, какие из них подходят под роли, которые использует расчёт зоны обзора (фокусное расстояние, формат матрицы, дальность, высота установки, наклон, поворот).

  По каждой роли отчёт показывает: задано ли её имя в настройках «Зон обзора», найден ли такой параметр на камере (экземпляр/тип), подходит ли его тип данных (Длина/Угол/Текст/Число), и какие ещё параметры камеры того же типа данных можно было бы использовать вместо него. Отдельно проверяется категория камеры и правило «наклон — обязательно параметр экземпляра, не типа».

  Плюс два раздела: «Геометрия и ориентация» — откуда берётся направление взгляда этого конкретного экземпляра (FacingOrientation/BasisY/BasisX/HandOrientation), отражение, хост, уровень, итоговый азимут, который реально уйдёт в построение зоны; и «Разбор семейства» — кнопка открывает файл семейства на редактирование (без показа окна) и читает все типоразмеры со значениями параметров, формулы, вложенные семейства, тела/вырезы, опорные плоскости, разъёмы, затем закрывает без сохранения.

  Ничего не пишет в модель и не меняет настройки — чисто чтение и отчёт в окне вывода pyRevit.
