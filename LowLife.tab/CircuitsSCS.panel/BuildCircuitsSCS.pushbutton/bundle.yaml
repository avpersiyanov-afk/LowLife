tooltip: |
  Строит электрические цепи СКС между панелью и устройствами. Выберите панель и все устройства вместе, одним выбором — рамкой и/или кликами, без определённого порядка (панель определяется автоматически по категории «Электрооборудование», среди выбранного должна быть ровно одна). На каждый электрический коннектор устройства создаётся отдельная электрическая цепь, подключённая напрямую к панели («домашний прогон», без промежуточных узлов и адресации) — у обычных устройств коннектор один, у устройств с несколькими (например розетка с двумя гнёздами RJ-45 в одном экземпляре) создаётся по цепи на каждый. Тип цепи определяется автоматически по электрическому коннектору устройства (как при ручном создании цепи в Revit), Data — только запасной вариант, если определить не удалось. Проводнику каждой цепи проставляется значение, выбранное заранее в настройках («Параметры СКС», раздел «Проводник для цепей СКС»), а параметру «Имя нагрузки» — «Обозначение» типа устройства + «Адрес устройства» (для устройств с несколькими коннекторами — с суффиксом -1/-2 по номеру цепи).
