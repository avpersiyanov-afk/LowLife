title: Обратная связь
tooltip: >-
  Сообщить автору LowLife о проблеме или предложить улучшение: выберите панель
  и кнопку, опишите, что случилось. Сообщения видит только автор расширения.
# Постоянный движок: сообщение отправляется в фоне уже после закрытия окна (pnotes.feedback.send_detached),
# и поток не должен обрываться вместе со скриптом кнопки.
engine:
  persistent: true
