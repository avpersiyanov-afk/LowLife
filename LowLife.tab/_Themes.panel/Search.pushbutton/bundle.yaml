title: Поиск
tooltip: >-
  Найти кнопку LowLife по названию: начните вводить подпись кнопки, название панели или слово из
  подсказки (регистр, «ё»/«е» и английская раскладка не мешают). Enter — запустить найденную кнопку,
  Ctrl+Enter — показать её на ленте (откроет вкладку и подсветит кнопку, даже если текущая тема её скрывает).
context: zero-doc
# Постоянный движок: подсветка кнопки на ленте снимается таймером уже после окончания скрипта.
engine:
  persistent: true
