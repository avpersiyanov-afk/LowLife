tooltip: |
  Строит черновую «рыбу» структурной схемы от выбора помещений — не от установленных устройств, в отличие от аналогичных кнопок СОТ/СПС/СКС. Сначала — параметр деления на секции, если у здания их несколько (каждая секция получит свой отдельный вид схемы); затем — параметр группировки (общее значение которого объединяет несколько помещений в один бокс, например «МОП»/«Квартира»). Оба шага можно пропустить — просто закройте диалог, если он не нужен.

  Дальше этажи (в каждой секции свои) идут по порядку сами, один за другим, без вопроса «на каком этаже» — на каждом либо обычный список с чекбоксами (группы и отдельные помещения вперемешку, можно отметить и то, и другое одновременно), либо, если для этажа уже есть с чем сравнить, компактное меню «Оставить как есть» / «Добавить ещё» / «Убрать часть» / «Выбрать заново» / «Пропустить этот этаж». Такое меню появляется автоматически: при первом заходе на этаж, если на нём нашлись помещения в тех же местах на плане, что были выбраны на предыдущем этаже (типовые этажи — снимать/добавлять не придётся, если этаж такой же); либо при возврате на уже пройденный этаж.

  После каждого этажа — «Следующий этаж» (по умолчанию) / «Вернуться к другому этажу» (список всех этажей секции — поправить прошлый или перескочить вперёд) / «Завершить и построить».

  Результат — по одному чертёжному виду «Структурная схема (черновик)» (или «… — <секция>», если секции были) на каждую секцию: рамка на каждый этаж, один прямоугольный бокс с подписью на каждое отмеченное помещение/группу. Без семейств, без узлов-устройств, без соединительных линий — только рамки и подписи, дальше схема дорабатывается вручную. Каждый повторный запуск полностью перестраивает эти виды с нуля.
