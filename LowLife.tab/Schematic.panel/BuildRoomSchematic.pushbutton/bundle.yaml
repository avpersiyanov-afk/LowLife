tooltip: |
  Строит черновую «рыбу» структурной схемы от выбора помещений — не от установленных устройств, в отличие от аналогичных кнопок СОТ/СПС/СКС. Сначала — параметр деления на секции, если у здания их несколько (каждая секция получит свой отдельный вид схемы); затем — параметр группировки (общее значение которого объединяет несколько помещений в один бокс, например «МОП»/«Квартира»). Оба шага можно пропустить.

  Дальше — цикл по этажам (в каждой секции свой): выбор этажа, затем — либо обычный список с чекбоксами (группы и отдельные помещения вперемешку, можно отметить и то, и другое одновременно), либо, если для этажа уже есть с чем сравнивать — меню «Оставить как есть» / «Добавить ещё» / «Убрать часть» / «Выбрать заново» / «Пропустить этот этаж». Такое меню появляется автоматически: при первом заходе на этаж, если на нём нашлись помещения в тех же местах на плане, что были выбраны на предыдущем обработанном этаже (типовые этажи — снимать/добавлять не придётся, если этаж такой же); либо при повторном заходе на уже пройденный этаж (чтобы вернуться и довыбрать/поправить — «Убрать часть» позволяет снять то, что было отмечено ошибочно).

  Результат — по одному чертёжному виду «Структурная схема (черновик)» (или «… — <секция>», если секции были) на каждую секцию: рамка на каждый выбранный этаж, один прямоугольный бокс с подписью на каждое отмеченное помещение/группу. Без семейств, без узлов-устройств, без соединительных линий — только рамки и подписи, дальше схема дорабатывается вручную. Каждый повторный запуск полностью перестраивает эти виды с нуля.
