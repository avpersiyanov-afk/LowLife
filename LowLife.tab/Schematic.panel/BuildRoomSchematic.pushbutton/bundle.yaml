tooltip: |
  Строит черновую «рыбу» структурной схемы от выбора помещений — не от установленных устройств, в отличие от аналогичных кнопок СОТ/СПС/СКС. Сначала — параметр деления на секции, если у здания их несколько (каждая секция получит свой отдельный вид схемы); шаг можно пропустить, просто закрыв диалог.

  Дальше этажи (в каждой секции свои) идут по порядку сами, один за другим. На каждом этаже — список ВСЕХ его помещений с чекбоксами: отметьте, что идёт на схему. Если отметили больше одного — появится вопрос «объединить что-то из отмеченного в один бокс?»; при «да» — ещё один список с чекбоксами (уже только из отмеченного) на состав одной группы плюс название бокса, можно повторить для нескольких групп. Всё, что не вошло ни в одну группу, — каждое помещение своим отдельным боксом.

  Если этаж похож на предыдущий обработанный (те же помещения в тех же местах на плане — типовые этажи), вместо списка сразу предлагается «Оставить как на предыдущем этаже» / «Выбрать заново» — не придётся заново всё отмечать на одинаковых этажах. То же самое — при возврате на уже пройденный этаж.

  После каждого этажа — «Следующий этаж» (по умолчанию) / «Вернуться к другому этажу» (список всех этажей секции — поправить прошлый или перескочить вперёд) / «Завершить и построить».

  Результат — по одному чертёжному виду «Структурная схема (черновик)» (или «… — <секция>», если секции были) на каждую секцию: рамка на каждый этаж, один прямоугольный бокс с подписью на каждое отмеченное помещение/группу. Без семейств, без узлов-устройств, без соединительных линий — только рамки и подписи, дальше схема дорабатывается вручную. Каждый повторный запуск полностью перестраивает эти виды с нуля.
