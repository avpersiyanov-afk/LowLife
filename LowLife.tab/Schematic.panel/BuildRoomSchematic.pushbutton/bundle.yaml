tooltip: |
  Строит черновую «рыбу» структурной схемы от выбора помещений — не от установленных устройств, в отличие от аналогичных кнопок СОТ/СПС/СКС. Сначала — параметр группировки (общее значение которого объединяет несколько помещений в один бокс схемы, например «МОП»/«Квартира»); «(без группировки)» — доступны только отдельные помещения.

  Дальше — цикл: выбор этажа, затем на нём один список с чекбоксами, где вперемешку и целые группы, и все помещения этажа по отдельности (можно отметить и группу, и вдобавок нужное помещение из неё же отдельно — например группу «Квартира» и отдельно «Тамбур-шлюз», «Лифтовый холл»). После добавления — «Выбрать ещё» (другой этаж или уточнить этот же) либо «Завершить и построить».

  Результат — чертёжный вид «Структурная схема (черновик)»: рамка на каждый выбранный этаж, один прямоугольный бокс с подписью на каждое отмеченное помещение/группу. Без семейств, без узлов-устройств, без соединительных линий — только рамки и подписи, дальше схема дорабатывается вручную. Каждый повторный запуск полностью перестраивает этот вид с нуля.
