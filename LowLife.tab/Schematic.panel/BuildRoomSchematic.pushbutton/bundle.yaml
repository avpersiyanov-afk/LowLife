tooltip: |
  Строит черновую «рыбу» структурной схемы от выбора помещений — не от установленных устройств, в отличие от аналогичных кнопок СОТ/СПС/СКС. Открывает окно: сверху — параметр группировки (общее значение которого объединяет несколько помещений в один бокс схемы), ниже — список этажей с чекбоксами на группы и на отдельные помещения. Чекбокс группы и чекбоксы её отдельных помещений независимы — можно отметить и группу целиком, и вдобавок одно из её помещений отдельно.

  Результат — чертёжный вид «Структурная схема (черновик)»: рамка на каждый выбранный этаж, один прямоугольный бокс с подписью на каждое отмеченное помещение/группу. Без семейств, без узлов-устройств, без соединительных линий — только рамки и подписи, дальше схема дорабатывается вручную. Каждый повторный запуск полностью перестраивает этот вид с нуля.
