tooltip: |
  Строит черновую «рыбу» структурной схемы по помещениям — не от установленных устройств, в отличие от аналогичных кнопок СОТ/СПС/СКС.

  Открывается одно окно: слева этажи, справа помещения выбранного этажа. В столбце «На схеме» напишите, как показать помещение на схеме; пусто — помещения на схеме нет. Одинаковая подпись у нескольких помещений этажа — один общий бокс (группа: «Квартиры», «МОП» и т.п.). Можно выделить несколько строк и задать им подпись разом. Этаж с тем же набором помещений, что у уже заполненного (типовой жилой), заполняется сам; подписи можно также скопировать с любого этажа по именам помещений.

  Подписи запоминаются между запусками. Результат — чертёжный вид: рамка на каждый этаж и по боксу с подписью на каждую подпись. Без семейств и линий — дальше схема дорабатывается вручную. Каждый запуск перестраивает вид с нуля.
