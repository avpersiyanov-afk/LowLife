tooltip: |
  Строит черновую «рыбу» структурной схемы от выбора помещений — не от установленных устройств, в отличие от аналогичных кнопок СОТ/СПС/СКС. Сначала — четыре параметра (каждый можно пропустить закрытием диалога, тогда берётся значение по умолчанию): параметр для имени помещения в маске, параметр для номера (маска — «Имя (Номер)»), параметр для секции (если у здания их несколько — каждая получит свой отдельный вид схемы) и параметр для объединения нескольких помещений в общую группу.

  Дальше этажи (в каждой секции свои) идут по порядку сами, один за другим. На каждом этаже — список отдельных помещений с чекбоксами, затем список найденных на этом этаже значений параметра общей группы (тоже с чекбоксами) — на схеме этажа будут и то, и другое одновременно. Если что-то уже перенесено с предыдущего этажа (по совпадению имени помещения или значения группы — типовые этажи), списки показывают только то, что ЕЩЁ не перенесено, чтобы можно было просто добавить недостающее; отдельным вопросом да/нет предлагается убрать что-то из перенесённого, если этаж отличается. То же самое — при возврате на уже пройденный этаж.

  После каждого этажа — «Следующий этаж» (по умолчанию) / «Вернуться к другому этажу» (список всех этажей секции) / «Завершить и построить». В конце — имя чертёжного вида (для нескольких секций к нему добавляется «— <секция>»).

  Результат — по одному чертёжному виду на каждую секцию: рамка на каждый этаж, один прямоугольный бокс с подписью на каждое отмеченное помещение/группу. Без семейств, без узлов-устройств, без соединительных линий — только рамки и подписи, дальше схема дорабатывается вручную. Каждый повторный запуск полностью перестраивает эти виды с нуля.
