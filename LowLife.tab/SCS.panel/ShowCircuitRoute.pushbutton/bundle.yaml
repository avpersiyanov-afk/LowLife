tooltip: |
  Показывает маршрут выбранной цепи СКС на модели — для визуальной проверки, что маршрут выбран правильно. Выберите устройство, входящее в интересующую цепь (если оно состоит в нескольких цепях — предложит выбрать нужную из списка). Строит временную линию (Detail Line на активном виде) через устройство, все узлы/стояки маршрута (по данным параметра «Маршрут цепи», записанного кнопкой «Расчёт длины цепи») и панель, и выделяет все эти элементы в модели, чтобы их было видно отдельно от линии. Вид сам масштабируется, чтобы весь маршрут поместился целиком. Линия временная: удаляется сама через несколько секунд, а также при повторном запуске кнопки (в т.ч. кнопки СКУД/СПС с той же функцией) — прошлая линия удаляется в любом случае.
