tooltip: |
  Выгружает текущие адреса СКС (панели, стояки, узлы маршрута) с активного вида в xlsx-файл — для передачи таблицы адресации подрядчику/на ПНР. Читает то, что уже записано в модель кнопкой «Адреса узлов» (модель не изменяет).

  Работает на движке CPython3 pyRevit и требует пакет openpyxl в его окружении: py -3 -m pip install openpyxl
