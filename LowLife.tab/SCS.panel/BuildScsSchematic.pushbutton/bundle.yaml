tooltip: |
  Строит/обновляет структурную схему СКС. Сама находит устройства через уже настроенные цепи и панели (те же критерии, что и «Расчёт длины цепи»), группирует их по этажу (подпись — «Этаж N (отметка)», порядок по отметке: отрицательные — внизу схемы, глубже — ниже; положительные — выше, чем больше отметка) и по помещению — рамки и раскладка устроены так же, как у структурной схемы СОТ.

  У каждой панели (шкафа/патч-панели) — своя независимая цветная шина: свой горизонтальный коллектор на каждом этаже, где у неё есть устройство (только её собственные отростки), свой вертикальный стояк слева от рамок через все её этажи. Коллекторы и стояки разных панелей на одном этаже разнесены — по высоте (коллектор) и по X (стояк), не накладываются друг на друга. Отростки, коллектор и стояк одной панели окрашены в один и тот же цвет (Line Style, создаётся автоматически по имени панели) — видно, какое устройство к какому шкафу идёт. Показаны только розетка и панель, без промежуточных узлов трассы (без стояков/узлов маршрута из «Адреса узлов»).

  Магистральные связи шкаф-шкаф (цепь, у которой вместо устройства оказалась другая целевая панель — например оптическая линия между двумя шкафами) отходят от собственного узла каждого шкафа (не от его шины устройств — на видимом расстоянии от неё) до своей отдельной вертикальной дорожки слева от стояков панелей, ярким жирным цветом; несколько связей через общий шкаф (цепочка A-B-C) используют одну общую дорожку на всех.

  Повторный запуск не пересоздаёт схему с нуля: обновляется вид с именем из настроек, раскладка предыдущего запуска хранится в служебном параметре этого вида — трогаются (двигаются/перерисовываются) только этаж/помещение/устройство, где реально что-то изменилось. Линии шины не редактируются вручную — перерисовываются заново на каждом запуске.

  Shift+клик — настройки этой кнопки.
title_en: "Riser\ndiagram"
tooltip_en: >-
  Builds/updates the SCS riser diagram. It finds the devices itself through the circuits and panels
  already set up (the same criteria as «Circuit length»), groups them by floor (label «Этаж N
  (elevation)», ordered by elevation: negative at the bottom of the diagram, deeper is lower; positive
  higher, the higher the elevation) and by room — frames and layout work the same way as in the CCTV
  riser diagram. Each panel (cabinet/patch panel) gets its own independent coloured bus: its own
  horizontal collector on every floor where it has a device (only its own branches) and its own
  vertical riser to the left of the frames through all its floors. Collectors and risers of different
  panels on one floor are spread apart — in height (collector) and in X (riser) — so they don't
  overlap. A panel's branches, collector and riser share one colour (a Line Style created
  automatically from the panel name), so you can see which device goes to which cabinet. Only the
  outlet and the panel are shown, without intermediate route nodes (no risers/route nodes from «Node
  addresses»). Cabinet-to-cabinet backbone links (a circuit whose target is another panel instead of a
  device — for example a fibre line between two cabinets) leave each cabinet's own node (not its
  device bus — at a visible distance from it) to their own vertical track to the left of the panel
  risers, in a bright bold colour; several links through a common cabinet (an A-B-C chain) share one
  track. Running it again doesn't rebuild the diagram from scratch: the view named in the settings is
  updated, the previous run's layout is kept in a service parameter of that view, and only the
  floor/room/device where something actually changed is touched (moved/redrawn). Bus lines are not
  edited by hand — they are redrawn on every run. Shift+click — settings for this button.
