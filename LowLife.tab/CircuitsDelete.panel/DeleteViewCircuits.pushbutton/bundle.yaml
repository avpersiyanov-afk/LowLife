tooltip: |
  Удаляет все электрические цепи, у которых хотя бы один элемент (устройство или панель-источник) виден на активном виде.

  Полезно для очистки тестовых/лишних цепей — например, оставшихся от ручной проверки в Revit UI или от кнопки «Цепи изолятор-устройства». Revit не даёт добавить элемент, уже состоящий в одной цепи, ещё в одну (ошибка electComponents при построении цепей шлейфов/СКС/СКУД), поэтому такие лишние цепи нужно сначала удалить.

  Перед удалением показывает список цепей (по «Номеру цепи», если задан) в окне вывода и спрашивает подтверждение.
title_en: "Delete circuits\nin view"
tooltip_en: >-
  Deletes every electrical circuit that has at least one element (a device or its source panel)
  visible in the active view. Handy for cleaning up test or stray circuits — for example, ones left
  over from a manual check in the Revit UI or from the «Isolator–device circuits» button. Revit won't
  add an element that already belongs to one circuit to another (the electComponents error when
  building loop/SCS/ACS circuits), so such stray circuits have to be deleted first. Before deleting,
  lists the circuits (by «Circuit Number», if set) in the output window and asks for confirmation.
