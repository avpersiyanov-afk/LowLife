tooltip: |
  Удаляет все электрические цепи, у которых хотя бы один элемент (устройство или панель-источник) виден на активном виде.

  Полезно для очистки тестовых/лишних цепей — например, оставшихся от ручной проверки в Revit UI или от кнопки «Цепи изолятор-устройства». Revit не даёт добавить элемент, уже состоящий в одной цепи, ещё в одну (ошибка electComponents при построении цепей шлейфов/СКС/СКУД), поэтому такие лишние цепи нужно сначала удалить.

  Перед удалением показывает список цепей (по «Номеру цепи», если задан) в окне вывода и спрашивает подтверждение.
