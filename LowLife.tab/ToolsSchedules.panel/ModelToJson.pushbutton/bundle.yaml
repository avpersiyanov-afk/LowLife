tooltip: 'Выгружает снимок модели в файл .json — элементы с параметрами и уровнем, по желанию с электрическими цепями (панель и состав), координатами, марками, помещениями и пространствами (в т.ч. из связей — с контурами, площадями и привязкой элементов) и каталогом загруженных типоразмеров для создания новых элементов. Для анализа (например, Claude) и правки значений с обратной загрузкой кнопкой «JSON → модель». Ключ связи с элементом — UniqueId. Правила формата записываются в сам файл («readme»). Shift+клик — настройки, что выгружать: область (активный вид / выделение / весь документ), категории, параметры, параметры только для чтения, параметры типа, пустые значения, цепи, координаты и поворот, марки, помещения с их параметрами, каталог типоразмеров. Изменённые в файле координаты при загрузке перемещают элементы.'
title_en: "Model\n→ JSON"
tooltip_en: >-
  Exports a model snapshot to a .json file — elements with parameters and level, optionally with
  electrical circuits (panel and members), coordinates, tags, rooms and spaces (including from links —
  with outlines, areas and element assignment) and a catalog of loaded types for creating new
  elements. For analysis (for example by Claude) and editing values with loading back via «JSON →
  model». The key linking to an element is UniqueId. The format rules are written into the file itself
  («readme»). Shift+click — settings for what to export: scope (active view / selection / whole
  document), categories, parameters, read-only parameters, type parameters, empty values, circuits,
  coordinates and rotation, tags, rooms with their parameters, type catalog. Coordinates changed in
  the file move the elements on loading.
