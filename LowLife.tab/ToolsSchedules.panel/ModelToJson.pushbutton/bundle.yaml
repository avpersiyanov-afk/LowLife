tooltip: 'Выгружает снимок модели в файл .json — элементы с параметрами и уровнем, по желанию с электрическими цепями (панель и состав), координатами, марками, помещениями и пространствами (в т.ч. из связей — с контурами, площадями и привязкой элементов). Для анализа (например, Claude) и правки значений с обратной загрузкой кнопкой «JSON → модель». Ключ связи с элементом — UniqueId. Правила формата записываются в сам файл («readme»). Shift+клик — настройки, что выгружать: область (активный вид / выделение / весь документ), категории, параметры, параметры только для чтения, параметры типа, пустые значения, цепи, координаты и поворот, марки, помещения с их параметрами. Изменённые в файле координаты при загрузке перемещают элементы.'
