tooltip: Загружает правки из снимка .json обратно в модель. Сравнивает «params» каждого элемента с моделью и показывает список «было → станет» — записываются только отмеченные правки, одной транзакцией (Ctrl+Z отменяет всё). Значения, которые в файле не правили, не пишутся (не откатывают изменения модели после выгрузки); правка параметра, который после выгрузки изменили и в модели, помечена ⚠ и по умолчанию не отмечена. Параметры только для чтения, параметры типа, цепи и координаты из файла не загружаются; элементы не создаются и не удаляются.
