tooltip: 'Загружает правки из снимка .json обратно в модель: значения параметров («params») и положение элементов («location» — перемещение, поворот, концы линейных элементов, голова марки). Показывает список «было → станет» — записываются только отмеченные правки, одной транзакцией (Ctrl+Z отменяет всё). То, что в файле не правили, не пишется (не откатывает изменения модели после выгрузки); правка поверх изменения в модели помечена ⚠ и по умолчанию не отмечена. Параметры только для чтения, параметры типа и цепи из файла не загружаются.'
