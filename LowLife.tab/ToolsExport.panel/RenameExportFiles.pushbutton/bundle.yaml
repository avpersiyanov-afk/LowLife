tooltip: |
  Переименовывает файлы выгрузки Revit/ModPlus — в имени каждого файла меняет «0000» на «000» (по умолчанию). Нужно, когда два листа идут под одним номером, но с разными именами: листам дают разные номера, а после выгрузки приводят к одному.

  Обычный клик — спросить папку выгрузки (подставляется прошлый путь), показать список и переименовать; в модели ничего не меняется. Shift+клик — настройки: что на что менять, расширения, подпапки, автозапуск после команды.
